[build]
  command = "npm run build"
  publish = "dist"

# Proxy ALL /api calls directly to your Render backend
[[redirects]]
  from = "/api/*"
  to = "https://geospatialinference.netlify.app.onrender.com/api/:splat"
  status = 200
  force = true

# Catch-all for SPA client routing (must be placed AFTER the /api redirect)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200